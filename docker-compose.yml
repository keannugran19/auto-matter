services:
    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
        ports:
            - "8000:8000"
        environment:
            - PORT=8000
            - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
        restart: unless-stopped

    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
        ports:
            - "3000:3000"
        environment:
            - BACKEND_URL=http://backend:8000
        depends_on:
            - backend
        restart: unless-stopped
